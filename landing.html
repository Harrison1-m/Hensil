<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Session | Hensil Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="frontend/css/style.css">
    <link rel="icon" type="image/x-icon" href="frontend/assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="frontend/assets/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="frontend/assets/apple-touch-icon.png">
    <style>
        body {
            background: var(--bg-primary, #0a0a0a);
            color: #e0e0e0;
        }
        .booking-landing-hero {
            padding: 80px 0 40px 0;
            text-align: center;
        }
        .booking-landing-hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #fff;
            margin-bottom: 1rem;
        }
        .booking-landing-hero h1 span {
            color: var(--accent-gold, #c5a059);
            font-style: italic;
        }
        .booking-landing-hero p {
            font-size: 1.15rem;
            color: #aaa;
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.6;
        }
        .booking-section {
            padding: 40px 0 100px 0;
            background: var(--bg-primary, #0a0a0a);
        }
        .booking-card {
            max-width: 750px;
            margin: 0 auto;
            background: var(--bg-secondary, #141414);
            padding: 45px;
            border-radius: 12px;
            border: 1px solid rgba(197, 160, 89, 0.3);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        @media(max-width: 768px) {
            .booking-landing-hero h1 { font-size: 2.2rem; }
            .booking-card { padding: 25px; }
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="loader-container">
            <img src="frontend/assets/logo-loader.png" alt="Hensil Logo" class="loader-logo">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Minimal Navigation -->
    <header id="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Hencil <span>Edits</span></a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Return to Main Studio</a></li>
                </ul>
            </nav>
            <div class="nav-actions">
                <button id="theme-toggle" aria-label="Toggle Theme"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </header>

    <!-- Booking Hero / Header -->
    <section class="booking-landing-hero">
        <div class="container reveal">
            <h1>Secure Your <span>Studio Commission</span></h1>
            <p>Fill out your project specifications below to reserve your date and instantly generate your official studio invoice.</p>
        </div>
    </section>

    <!-- Direct Booking Section -->
    <section class="booking-section" id="book">
        <div class="container">
            <div class="booking-card reveal">
                <form id="booking-form" class="studio-contact-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="booking-name">Your Full Name *</label>
                            <input
                                type="text"
                                id="booking-name"
                                name="name"
                                placeholder="e.g. Sarah Jenkins"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="booking-email">Email Address *</label>
                            <input
                                type="email"
                                id="booking-email"
                                name="email"
                                placeholder="sarah@example.com"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="booking-phone">Phone / WhatsApp Line</label>
                            <input
                                type="tel"
                                id="booking-phone"
                                name="phone"
                                placeholder="+254 700 000 000"
                            >
                        </div>

                        <div class="form-group">
                            <label for="booking-service">Assignment Type *</label>
                            <select id="booking-service" name="service" required>
                                <option value="" disabled selected>Select studio package...</option>
                                <option value="Essential Portrait">Essential Portrait Set (ksh 1,500)</option>
                                <option value="Commercial Production">Commercial Production (ksh 3,800)</option>
                                <option value="Full-Day Cinematic Wedding">Full-Day Cinematic Wedding (ksh 13,200)</option>
                                <option value="Custom Editorial Commission">Custom Editorial Commission</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="booking-date">Preferred Production Date *</label>
                        <input
                            type="date"
                            id="booking-date"
                            name="date"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="booking-message">Project Vision & Details *</label>
                        <textarea
                            id="booking-message"
                            name="message"
                            rows="5"
                            placeholder="Describe your creative vision, location, and aesthetic preferences..."
                            required
                        ></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px; padding: 15px; font-size: 1.05rem;">
                        Submit Booking & Generate Invoice
                    </button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container footer-content" style="justify-content: space-between; text-align: center;">
            <div class="footer-brand" style="margin: 0 auto;">
                <h2>Hencil <span>Edits</span></h2>
                <p>Luxury photography and media production studio.</p>
                <p style="margin-top: 10px; font-size: 0.9rem; color: #888;">&copy; 2026 Hencil Edits. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <a href="https://wa.me/759701803" class="whatsapp-float" target="_blank" aria-label="Chat on WhatsApp"><i class="fab fa-whatsapp"></i></a>
    <button id="back-to-top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>

    <script src="frontend/js/script.js?v=20261023"></script>
</body>
</html>
